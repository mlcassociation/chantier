# Token-free publishing: GitHub Actions OIDC -> npm trusted publishers.
# Prerequisite (one-time, per package, owner-side): on npmjs.com open
# https://www.npmjs.com/package/<name>/access -> Trusted publishing -> add
# GitHub Actions publisher: org/user mlcassociation, repo chantier, workflow
# filename publish.yml, action "npm publish" allowed. Applies to all six
# packages: chantier, @chantier/permissions, @chantier/core, @chantier/mcp,
# @chantier/providers, @chantier/tools, @chantier/tui.
#
# Publishes on tag push (v*) in dependency order: a package whose internal
# dependencies are not yet at the new version cannot resolve, so order is
# permissions -> core -> providers -> tools -> tui -> cli.
name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Idempotent publishes: a re-run skips versions already on the registry
      # (a strict re-run would die at the first published package and never
      # reach the rest).
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/permissions
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/core
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/mcp
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/providers
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/tools
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/tui
      - run: |
          if npm view "$npm_package_name@$npm_package_version" version >/dev/null 2>&1; then
            echo "already published: $npm_package_name@$npm_package_version"
          else
            npm publish --provenance --access public
          fi
        working-directory: packages/cli